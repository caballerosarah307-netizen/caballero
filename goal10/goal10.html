<!DOCTYPE html>
<html>
<head>
    <title>CSS Display Property</title>

    <style>
        body {
            font-family: "Times New Roman", serif;
        }

        h1 {
            font-size: 40px;
        }

        .red {
            background-color: red;
            color: white;
            width: 320px;
            height: 300px;
            font-size: 20px;
        }

        .green {
            background-color: green;
            color: white;
            width: 320px;
            height: 300px;
            font-size: 20px;
        }

        .blue {
            background-color: blue;
            color: white;
            width: 320px;
            height: 300px;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h1>CSS Display Property</h1>

    <div class="red">
        Red Paragraph
    </div>

    <br>

    <div class="green">
        Green Paragraph
    </div>

    <br>

    <div class="blue">
        Blue Paragraph
    </div>

</body>
</html>
