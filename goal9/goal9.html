<!DOCTYPE html>
<html>
<head>
    <title>CSS Display Property</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 20px;
        }

        h1 {
            font-size: 40px;
        }

        .container {
            display: flex;
            gap: 5px;
        }

        .paragraph {
            width: 33.33%;
            height: 330px;

            color: white;
            font-size: 25px;

            padding: 0;
        }

        .red {
            background-color: red;
        }

        .green {
            background-color: green;
        }

        .blue {
            background-color: blue;
        }
    </style>
</head>

<body>

    <h1>CSS Display Property</h1>

    <div class="container">

        <div class="paragraph red">
            Red Paragraph
        </div>

        <div class="paragraph green">
            Green Paragraph
        </div>

        <div class="paragraph blue">
            Blue Paragraph
        </div>

    </div>

</body>
</html>
